name: Tests

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pillow и PyYAML нужны тестам и scripts/style_presets.py; torch/diffusers/GPU не нужны — тесты используют заглушки
      - run: python -m pip install pillow pyyaml
      - run: python -m unittest discover -s tests -t . -v
